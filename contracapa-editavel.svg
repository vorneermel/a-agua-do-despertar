<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
<rect width="1600" height="2560" fill="#0b202c"/>
<path d="M150 220H1450" stroke="#c5a566" stroke-width="3"/>
<text x="150" y="360" fill="#eedbb1" font-family="Georgia,serif" font-size="58">A ÁGUA DO DESPERTAR</text>
<text x="150" y="455" fill="#a4c9d7" font-family="Georgia,serif" font-size="42">O encontro · Livro 1</text>
<text x="150" y="650" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">Ele pediu água. Na manhã seguinte, o mundo já</text>
<text x="150" y="714" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">não parecia o mesmo.</text>
<text x="150" y="842" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">Israel vive nas ruas quando recebe uma garrafa</text>
<text x="150" y="906" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">de uma desconhecida. Depois de beber, desperta</text>
<text x="150" y="970" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">com uma inteligência extraordinária:</text>
<text x="150" y="1034" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">lembranças se organizam, problemas revelam</text>
<text x="150" y="1098" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">soluções e ideias começam a transformar sua</text>
<text x="150" y="1162" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">vida.</text>
<text x="150" y="1290" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">A mulher se chama Yolanda. É química, e o</text>
<text x="150" y="1354" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">líquido que carregava era uma descoberta que</text>
<text x="150" y="1418" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">ainda não compreendia. Enquanto Israel se</text>
<text x="150" y="1482" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">torna investidor e procura quem lhe deu a</text>
<text x="150" y="1546" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">água, ela aperfeiçoa a fórmula com Clara, sua</text>
<text x="150" y="1610" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">amiga de laboratório. Ao tomá-la, descobre que</text>
<text x="150" y="1674" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">duas mentes podem estar mais próximas do que</text>
<text x="150" y="1738" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">dois corpos.</text>
<text x="150" y="1866" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">Encontrar um ao outro é apenas o primeiro</text>
<text x="150" y="1930" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">desafio. Há quem queira transformar o</text>
<text x="150" y="1994" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">despertar em mercadoria — e uma amostra</text>
<text x="150" y="2058" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">desapareceu.</text>
<text x="150" y="2186" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">Uma história sobre inteligência,</text>
<text x="150" y="2250" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">responsabilidade e o valor de enxergar quem</text>
<text x="150" y="2314" fill="#f5f0e6" font-family="Georgia,serif" font-size="42">sempre passou despercebido.</text>
</svg>